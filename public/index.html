<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theresia Mail Pro</title>
  <style>
    :root {
      --bg: #050505;
      --card-bg: rgba(255, 255, 255, 0.02);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-focus: rgba(255, 255, 255, 0.25);
      --text-main: #f0f0f0;
      --text-muted: #666666;
      --accent: #ffffff;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 2.5rem 1rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Animated Minimalist Grid Background */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 30px 30px;
      z-index: -2;
      animation: pulseGrid 8s ease-in-out infinite alternate;
    }

    @keyframes pulseGrid {
      0% { opacity: 0.4; }
      100% { opacity: 0.8; }
    }

    .container {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--card-border);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(180deg, #fff 0%, #a1a1a1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.75rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 1.25rem;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card:hover {
      border-color: rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* Control Panel Minimalist */
    .email-wrapper {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .input-box {
      flex: 1;
      min-width: 220px;
      position: relative;
    }

    input[type="text"] {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.7rem 1rem;
      border-radius: 8px;
      font-family: 'SF Mono', monospace, sans-serif;
      font-size: 0.85rem;
      outline: none;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus {
      border-color: var(--card-border-focus);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.05);
    }

    .btn-group {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    button {
      background: var(--text-main);
      color: var(--bg);
      border: none;
      padding: 0.65rem 1rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
    }

    button:active {
      transform: translateY(0);
    }

    button.btn-subtle {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border: 1px solid var(--card-border);
    }

    button.btn-subtle:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    button.btn-danger {
      background: rgba(255, 59, 48, 0.1);
      color: #ff453a;
      border: 1px solid rgba(255, 59, 48, 0.2);
    }

    button.btn-danger:hover {
      background: rgba(255, 59, 48, 0.2);
      box-shadow: 0 4px 12px rgba(255, 59, 48, 0.15);
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      padding-top: 0.75rem;
      border-top: 1px solid var(--card-border);
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #30d158;
      box-shadow: 0 0 8px #30d158;
      animation: blink 2s infinite;
    }

    .pulse-dot.off {
      background: #555;
      box-shadow: none;
      animation: none;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Inbox Layout & Animation */
    .inbox-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }

    @media(min-width: 680px) {
      .inbox-grid {
        grid-template-columns: 260px 1fr;
      }
    }

    .mail-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      max-height: 380px;
      overflow-y: auto;
    }

    .mail-item {
      padding: 0.65rem 0.85rem;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      cursor: pointer;
      background: rgba(0, 0, 0, 0.2);
      transition: all 0.25s ease;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .mail-item:hover, .mail-item.active {
      border-color: rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.05);
      transform: translateX(3px);
    }

    .mail-item .sender {
      font-weight: 600;
      font-size: 0.8rem;
      color: #fff;
      margin-bottom: 0.1rem;
    }

    .mail-item .subject {
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mail-viewer {
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 1rem;
      min-height: 280px;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .mail-header {
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 0.75rem;
      margin-bottom: 0.85rem;
    }

    .mail-body {
      font-size: 0.85rem;
      line-height: 1.6;
      color: #ccc;
      word-break: break-word;
      overflow-y: auto;
      max-height: 300px;
    }

    /* Style untuk link bawaan isi email agar serasi */
    .mail-body a {
      color: #fff !important;
      text-decoration: underline;
    }

    .empty-state {
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1;
      min-height: 180px;
      color: var(--text-muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>Theresia Mail Pro</h1>
        <p class="subtitle">Minimalist Temporary Email</p>
      </div>
    </header>

    <!-- Top Card -->
    <div class="card">
      <div class="email-wrapper">
        <div class="input-box">
          <input type="text" id="emailDisplay" placeholder="Klik 'Generate Email'..." readonly>
        </div>
        <div class="btn-group">
          <button onclick="handleCreate()">Generate</button>
          <button class="btn-subtle" onclick="copyEmail()">Email</button>
          <button class="btn-subtle" onclick="copyDirectUrl()">URL</button>
          <button class="btn-danger" onclick="handleDelete()">Delete</button>
        </div>
      </div>

      <div class="status-bar">
        <div class="status-indicator">
          <span id="statusDot" class="pulse-dot off"></span>
          <span id="statusText">Idle</span>
        </div>
        <div>
          <span>Expired: </span><span id="expireText" style="color: var(--text-main); font-weight: 500;">-</span>
        </div>
      </div>
    </div>

    <!-- Inbox Card -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.85rem;">
        <span style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted);">Inbox</span>
        <button class="btn-subtle" style="padding: 0.3rem 0.6rem; font-size: 0.7rem;" onclick="checkInbox()">Sync</button>
      </div>

      <div class="inbox-grid">
        <div class="mail-list" id="mailList">
          <div class="empty-state">Belum Ada Pesan</div>
        </div>

        <div class="mail-viewer" id="mailViewer">
          <div class="empty-state">Pilih pesan untuk membaca</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentToken = null;
    let currentEmail = null;
    let autoRefreshTimer = null;
    let cachedMessages = [];
    let activeIndex = null;

    window.onload = () => {
      const pathParts = window.location.pathname.split('/');
      const tokenFromUrl = pathParts[2] || pathParts[1];

      if (tokenFromUrl && tokenFromUrl !== "index.html" && tokenFromUrl.trim() !== "") {
        currentToken = tokenFromUrl;
        loadExistingInbox(currentToken);
      } else {
        const savedToken = localStorage.getItem("tm_token");
        if (savedToken) {
          currentToken = savedToken;
          loadExistingInbox(currentToken);
        }
      }
    };

    function setStatus(text, active = true) {
      document.getElementById("statusText").innerText = text;
      const dot = document.getElementById("statusDot");
      if (active) dot.classList.remove("off");
      else dot.classList.add("off");
    }

    function formatExpiration(expireTimeStr) {
      if (!expireTimeStr) return "24 Jam Active";
      const expDate = new Date(expireTimeStr);
      if (isNaN(expDate.getTime())) return expireTimeStr;
      
      return expDate.toLocaleDateString("id-ID", {
        day: 'numeric', month: 'short'
      }) + ", " + expDate.toLocaleTimeString("id-ID", {
        hour: '2-digit', minute: '2-digit'
      }) + " WIB";
    }

    async function handleCreate() {
      setStatus("Generating...", false);
      try {
        const res = await fetch("/api/create", { method: "POST" });
        const data = await res.json();

        if (data.success) {
          currentToken = data.access_token;
          currentEmail = data.email;

          localStorage.setItem("tm_token", currentToken);
          window.history.pushState({}, "", `/email/${currentToken}`);

          document.getElementById("emailDisplay").value = currentEmail;
          document.getElementById("expireText").innerText = formatExpiration(data.expires_at);
          
          cachedMessages = [];
          activeIndex = null;
          renderMailList([]);
          renderMailDetail(null);
          
          startAutoRefresh();
          setStatus("Active");
        } else {
          alert("Gagal: " + (data.error || "Gagal membuat email"));
          setStatus("Error", false);
        }
      } catch (err) {
        alert("Error: " + err.message);
        setStatus("Error", false);
      }
    }

    async function loadExistingInbox(token) {
      setStatus("Syncing...", true);
      document.getElementById("emailDisplay").value = "Syncing email...";
      
      const success = await checkInbox();
      if (success) {
        startAutoRefresh();
        setStatus("Active");
      } else {
        setStatus("Expired / Off", false);
        document.getElementById("emailDisplay").value = "Email Expired atau Tidak Ada";
      }
    }

    async function checkInbox() {
      if (!currentToken) return false;

      try {
        const res = await fetch(`/api/inbox?token=${encodeURIComponent(currentToken)}`);
        const data = await res.json();

        if (data.success) {
          if (data.email) {
            currentEmail = data.email;
            document.getElementById("emailDisplay").value = currentEmail;
          }
          if (data.expires_at) {
            document.getElementById("expireText").innerText = formatExpiration(data.expires_at);
          }

          cachedMessages = data.messages || [];
          renderMailList(cachedMessages);
          return true;
        } else {
          return false;
        }
      } catch (err) {
        return false;
      }
    }

    function startAutoRefresh() {
      if (autoRefreshTimer) clearInterval(autoRefreshTimer);
      autoRefreshTimer = setInterval(checkInbox, 5000);
    }

    async function handleDelete() {
      if (!currentToken) return;
      if (!confirm("Hapus inbox ini secara permanen?")) return;

      try {
        await fetch("/api/delete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: currentToken })
        });

        localStorage.removeItem("tm_token");
        currentToken = null;
        currentEmail = null;

        window.history.pushState({}, "", "/");
        document.getElementById("emailDisplay").value = "";
        document.getElementById("expireText").innerText = "-";
        
        if (autoRefreshTimer) clearInterval(autoRefreshTimer);
        setStatus("Idle", false);
        renderMailList([]);
        renderMailDetail(null);
      } catch (err) {
        alert("Gagal hapus: " + err.message);
      }
    }

    function renderMailList(messages) {
      const container = document.getElementById("mailList");
      if (!messages || messages.length === 0) {
        container.innerHTML = '<div class="empty-state">Belum Ada Pesan</div>';
        return;
      }

      container.innerHTML = messages.map((m, idx) => `
        <div class="mail-item ${activeIndex === idx ? 'active' : ''}" onclick="selectMail(${idx})">
          <div class="sender">${m.sender_name || m.sender}</div>
          <div class="subject">${m.subject || "(Tanpa Subjek)"}</div>
        </div>
      `).join('');
    }

    function selectMail(index) {
      activeIndex = index;
      renderMailList(cachedMessages);
      renderMailDetail(cachedMessages[index]);
    }

    function renderMailDetail(mail) {
      const container = document.getElementById("mailViewer");
      if (!mail) {
        container.innerHTML = '<div class="empty-state">Pilih pesan untuk membaca</div>';
        return;
      }

      const content = mail.html_body || mail.text_body || "<i>Pesan kosong.</i>";

      container.innerHTML = `
        <div class="mail-header">
          <h3 style="font-size: 0.95rem; margin-bottom: 0.3rem;">${mail.subject || "(Tanpa Subjek)"}</h3>
          <div style="font-size: 0.75rem; color: var(--text-muted);">Dari: ${mail.sender_name ? `${mail.sender_name} &lt;${mail.sender}&gt;` : mail.sender}</div>
          <div style="font-size: 0.75rem; color: var(--text-muted);">Waktu: ${new Date(mail.received_at).toLocaleString('id-ID')}</div>
        </div>
        <div class="mail-body">${content}</div>
      `;
    }

    function copyEmail() {
      const val = document.getElementById("emailDisplay").value;
      if (!val || val.includes("...")) return;
      navigator.clipboard.writeText(val);
      alert("Email berhasil disalin!");
    }

    function copyDirectUrl() {
      if (!currentToken) return alert("Generate email terlebih dahulu!");
      const directUrl = `${window.location.origin}/email/${currentToken}`;
      navigator.clipboard.writeText(directUrl);
      alert("URL Email disalin!");
    }
  </script>
</body>
</html>
